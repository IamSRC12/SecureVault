<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureVault</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="#6366f1">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
        </svg>
        <span class="logo-text">SecureVault</span>
      </div>
      <div class="header-right">
        <div id="status-indicator" class="status-dot status-unknown" title="Checking..."></div>
        <span id="status-label" class="status-label">Checking</span>
      </div>
    </header>

    <!-- Main content area -->
    <main id="main-content">
      <!-- State: loading -->
      <div id="state-loading" class="state-panel">
        <div class="spinner"></div>
        <p class="muted">Connecting to SecureVault...</p>
      </div>

      <!-- State: disconnected -->
      <div id="state-disconnected" class="state-panel hidden">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.5">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
        </svg>
        <h3>App Not Running</h3>
        <p class="muted">Open the SecureVault desktop app to use this extension</p>
      </div>

      <!-- State: locked -->
      <div id="state-locked" class="state-panel hidden">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.5">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <h3>Vault is Locked</h3>
        <p class="muted">Enter your master password to unlock</p>
        <div class="input-group">
          <input id="unlock-password" type="password" placeholder="Master password" class="input-field" />
          <button id="unlock-btn" class="btn btn-primary btn-full">Unlock</button>
        </div>
        <p id="unlock-error" class="error-text hidden">Incorrect password</p>
      </div>

      <!-- State: connected -->
      <div id="state-connected" class="hidden">
        <!-- Current site section -->
        <div class="site-section">
          <div class="site-header">
            <img id="site-favicon" src="" alt="" class="site-favicon hidden" />
            <div>
              <div id="site-domain" class="site-domain">—</div>
              <div class="muted small">Credentials for this site</div>
            </div>
          </div>

          <!-- Credentials list -->
          <div id="credentials-list"></div>

          <!-- No credentials message -->
          <div id="no-credentials" class="no-creds hidden">
            <p class="muted small">No saved credentials for this site</p>
          </div>
        </div>

        <div class="divider"></div>

        <!-- Quick actions -->
        <div class="quick-actions">
          <p class="section-label">Quick Actions</p>
          <button id="btn-open-app" class="btn btn-secondary btn-full">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
            </svg>
            Open SecureVault App
          </button>
          <button id="btn-generate" class="btn btn-secondary btn-full">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3v1m0 16v1M4.22 4.22l.7.7m12.16 12.16.7.7M3 12h1m16 0h1M4.22 19.78l.7-.7M18.36 5.64l.7-.7"/>
            </svg>
            Generate Password
          </button>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span class="muted small">SecureVault v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
